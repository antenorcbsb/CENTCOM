<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalhão Sapadores Bombeiros de Braga - Situação Operacional</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #060b17;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #0284c7;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: clamp(8px, 1.2vh, 16px);
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
    }

    section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .seccao-titulo {
      font-size: clamp(0.75rem, 1.2vh, 0.95rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .grid-cards {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: clamp(6px, 1vw, 10px);
      min-height: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: clamp(6px, 1vh, 10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    .card-to { border-left: 4px solid var(--accent-green); }
    .to-nome { font-size: clamp(0.85rem, 1.3vh, 1.05rem); font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .to-detalhes { display: flex; flex-direction: column; gap: 2px; font-size: clamp(0.75rem, 1.1vh, 0.85rem); color: var(--text-muted); }
    .badge-canal { display: inline-block; background-color: var(--accent-blue); color: #fff; font-weight: 700; padding: 1px 6px; border-radius: 4px; font-size: clamp(0.7rem, 1vh, 0.8rem); }

    .card-inop { border-left: 4px solid var(--accent-red); flex-direction: row; justify-content: space-between; align-items: center; }
    .inop-info { overflow: hidden; }
    .inop-info h4 { font-size: clamp(0.85rem, 1.3vh, 1rem); font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inop-info p { font-size: clamp(0.75rem, 1.1vh, 0.85rem); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-inop { background-color: var(--accent-red); color: #ffffff; font-weight: 800; font-size: clamp(0.65rem, 1vh, 0.75rem); padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }

    .card-agendamento { border-left: 4px solid var(--accent-orange); }
    .agendamento-data { color: var(--accent-orange); font-weight: 700; font-size: clamp(0.75rem, 1.1vh, 0.85rem); }
    .agendamento-desc { font-size: clamp(0.85rem, 1.2vh, 0.95rem); font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agendamento-meios { font-size: clamp(0.75rem, 1.1vh, 0.85rem); color: #38bdf8; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-observacao { border-left: 4px solid var(--accent-purple); }
    .obs-titulo { font-weight: 700; color: #c084fc; font-size: clamp(0.7rem, 1vh, 0.8rem); text-transform: uppercase; }
    .obs-texto { font-size: clamp(0.8rem, 1.2vh, 0.95rem); font-weight: 600; color: #ffffff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .sem-registos { color: var(--text-muted); font-style: italic; padding: 6px; font-size: clamp(0.75rem, 1.1vh, 0.85rem); }

    .rodape-ticker {
      height: clamp(36px, 5vh, 44px);
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
      border-top: 2px solid var(--accent-blue);
      flex-shrink: 0;
      margin-left: calc(-1 * clamp(8px, 1.2vh, 16px));
      margin-right: calc(-1 * clamp(8px, 1.2vh, 16px));
    }
    .ticker-label { background-color: var(--accent-blue); color: #ffffff; padding: 0 12px; height: 100%; display: flex; align-items: center; gap: 6px; white-space: nowrap; z-index: 2; font-size: clamp(0.7rem, 1vh, 0.8rem); letter-spacing: 0.5px; }
    .ticker-conteudo { flex: 1; overflow: hidden; white-space: nowrap; position: relative; }
    .ticker-texto { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker-animacao 25s linear infinite; }
    .ticker-item { display: inline-flex; align-items: center; margin-right: 30px; }
    .ticker-separador { margin-left: 30px; color: #38bdf8; opacity: 0.7; }
    .badge-perigo { padding: 2px 6px; border-radius: 4px; font-weight: 800; margin-left: 6px; text-transform: uppercase; font-size: 0.75rem; }

    @keyframes ticker-animacao { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
  </style>
</head>
<body>

  <section>
    <div class="seccao-titulo">Teatro de Operações / Canais</div>
    <div class="grid-cards" id="container-to">
      <div class="card sem-registos">A carregar Teatro de Operações...</div>
    </div>
  </section>

  <section>
    <div class="seccao-titulo" style="color: #f87171;">Veículos Inoperacionais (INOP)</div>
    <div class="grid-cards" id="container-inop">
      <div class="card sem-registos">A carregar viaturas INOP...</div>
    </div>
  </section>

  <section>
    <div class="seccao-titulo" style="color: var(--accent-orange);">Agendamentos</div>
    <div class="grid-cards" id="container-agendamentos">
      <div class="card sem-registos">A carregar agendamentos...</div>
    </div>
  </section>

  <section>
    <div class="seccao-titulo" style="color: var(--accent-purple);">Observações</div>
    <div class="grid-cards" id="container-observacoes">
      <div class="card sem-registos">A carregar observações...</div>
    </div>
  </section>

  <footer class="rodape-ticker">
    <div class="ticker-label"><i class="fa-solid fa-cloud-sun"></i> IPMA BRAGA</div>
    <div class="ticker-conteudo">
      <div class="ticker-texto" id="ticker-texto">
        <span class="ticker-item">A obter dados oficiais do IPMA...</span>
      </div>
    </div>
  </footer>

  <script>
    const SHEET_ID = '1SBvUBwqw7ZOaptKK6YehF8WErcOxzR9pmxtKnehRCx8';
    
    const GID_VIATURAS = '0'; 
    const GID_TO = '1346973124'; 
    const GID_AGENDAMENTOS = '1209384525'; 
    const GID_OBSERVACOES = '1563121154'; 

    const obterUrlGviz = (gid) => 
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&_cacheBust=${Date.now()}`;

    const URL_IPMA_METEO = 'https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/1030300.json';
    const URL_IPMA_TIPOS = 'https://api.ipma.pt/open-data/weather-type-classe.json';
    const URL_IPMA_RCM = 'https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-dico.json';
    const DICO_BRAGA = '0303';

    function obterNivelPerigoIncendio(rcmVal) {
      const niveis = {
        1: { texto: 'Reduzido', bg: '#10b981', color: '#ffffff', icone: '🟢' },
        2: { texto: 'Moderado', bg: '#eab308', color: '#000000', icone: '🟡' },
        3: { texto: 'Elevado', bg: '#f97316', color: '#ffffff', icone: '🟠' },
        4: { texto: 'Muito Elevado', bg: '#ef4444', color: '#ffffff', icone: '🔴' },
        5: { texto: 'Máximo', bg: '#a855f7', color: '#ffffff', icone: '🟣' }
      };
      return niveis[rcmVal] || { texto: 'N/A', bg: '#64748b', color: '#ffffff', icone: '⚪' };
    }

    async function carregarMeteoIPMA() {
      const containerTicker = document.getElementById('ticker-texto');
      if (!containerTicker) return;

      try {
        const [resMeteo, resTipos, resRcm] = await Promise.all([
          fetch(URL_IPMA_METEO),
          fetch(URL_IPMA_TIPOS),
          fetch(URL_IPMA_RCM).catch(() => null)
        ]);

        if (!resMeteo.ok || !resTipos.ok) throw new Error("Erro IPMA");

        const dataMeteo = await resMeteo.json();
        const dataTipos = await resTipos.json();

        const previsaoHoje = dataMeteo.data[0];
        const tMin = Math.round(previsaoHoje.tMin);
        const tMax = Math.round(previsaoHoje.tMax);
        const probChuva = previsaoHoje.precipitaProb;
        const idTipoTempo = previsaoHoje.idWeatherType;

        const tipoObjeto = dataTipos.data.find(t => t.idWeatherType === idTipoTempo);
        const descTempo = tipoObjeto ? tipoObjeto.descWeatherTypePT : 'Tempo Variável';

        let perigoIncendioHTML = '🔥 <strong>Perigo Incêndio Rural:</strong> N/A';
        if (resRcm && resRcm.ok) {
          const dataRcm = await resRcm.json();
          const dataChave = Object.keys(dataRcm)[0];
          if (dataChave && dataRcm[dataChave] && dataRcm[dataChave][DICO_BRAGA]) {
            const rcmVal = dataRcm[dataChave][DICO_BRAGA].rcm;
            const infoRcm = obterNivelPerigoIncendio(rcmVal);
            perigoIncendioHTML = `🔥 <strong>Perigo Incêndio Rural:</strong> ${infoRcm.icone} <span class="badge-perigo" style="background-color: ${infoRcm.bg}; color: ${infoRcm.color};">${infoRcm.texto}</span>`;
          }
        }

        const mensagens = [
          `📍 <strong>Braga (IPMA):</strong> ${descTempo}`,
          `🌡️ <strong>Máx / Mín Hoje:</strong> ${tMax}°C / ${tMin}°C`,
          `🌧️ <strong>Prob. de Chuva:</strong> ${probChuva}%`,
          perigoIncendioHTML
        ];

        containerTicker.innerHTML = mensagens
          .map(msg => `<span class="ticker-item">${msg}</span>`)
          .join('<span class="ticker-separador">✦</span>');

      } catch (err) {
        containerTicker.innerHTML = `<span class="ticker-item">⚠️ Impossível obter os dados do IPMA de momento.</span>`;
      }
    }

    function parseCSV(text) {
      const linhas = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (linhas.length < 2) return [];

      const parseLinha = (linha) => {
        const res = [];
        let cur = '';
        let dentroAspas = false;
        for (let i = 0; i < linha.length; i++) {
          const c = linha[i];
          if (c === '"') dentroAspas = !dentroAspas;
          else if (c === ',' && !dentroAspas) {
            res.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        res.push(cur.trim().replace(/^"|"$/g, ''));
        return res;
      };

      const cabecalhos = parseLinha(linhas[0]).map(c => c.trim().toLowerCase());
      return linhas.slice(1).map(linha => {
        const valores = parseLinha(linha);
        const obj = {};
        cabecalhos.forEach((cabecalho, idx) => {
          obj[cabecalho] = valores[idx] || '';
        });
        return obj;
      });
    }

    function obterValorCampo(item, chaves) {
      for (const k of chaves) {
        if (item[k] !== undefined && item[k] !== '') {
          return item[k];
        }
      }
      return '';
    }

    // 1. TEATRO DE OPERAÇÕES / CANAIS
    async function carregarTeatroOperacoes() {
      try {
        const res = await fetch(obterUrlGviz(GID_TO));
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-to');
        container.innerHTML = '';

        const valoresIgnorados = ['INOP', 'INOPERACIONAL', 'DISPONIVEL', 'DISPONÍVEL', 'OPERACIONAL', '-', 'N/A', ''];

        const dadosComCanal = dados.filter(item => {
          const canal = obterValorCampo(item, ['canais', 'canal', 'siresp', 'bsb', 'frequencia', 'rádio', 'radio']).trim();
          return canal !== '' && !valoresIgnorados.includes(canal.toUpperCase());
        });

        if (dadosComCanal.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem canais/rádios atribuídos de momento.</div>`;
          return;
        }

        dadosComCanal.forEach(item => {
          const evento = obterValorCampo(item, ['evento', 'ocorrência', 'ocorrencia', 'teatro de operações', 'to', 'veículo', 'veiculo', 'viatura', 'nome']) || 'Rádio / Canal';
          const local = obterValorCampo(item, ['local', 'localização', 'localizacao', 'sitio']);
          const canais = obterValorCampo(item, ['canais', 'canal', 'siresp', 'bsb', 'frequencia', 'rádio', 'radio']);

          const div = document.createElement('div');
          div.className = 'card card-to';
          div.innerHTML = `
            <div class="to-nome">${evento}</div>
            <div class="to-detalhes">
              ${local ? `<div>📍 <strong>Local:</strong> ${local}</div>` : ''}
              <div>📻 <strong>Canal:</strong> <span class="badge-canal">${canais}</span></div>
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro TO:", err);
      }
    }

    // 2. VIATURAS INOP
    async function carregarViaturasINOP() {
      try {
        const res = await fetch(obterUrlGviz(GID_VIATURAS));
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-inop');
        container.innerHTML = '';

        const viaturasInop = dados.filter(v => {
          const estado = obterValorCampo(v, ['estado operacional', 'estado', 'status', 'situacao']).toUpperCase();
          return estado.includes('INOP') || estado.includes('INOPERACIONAL');
        });

        if (viaturasInop.length === 0) {
          container.innerHTML = `<div class="card sem-registos" style="color: var(--accent-green);">✓ Todas as viaturas estão operacionais.</div>`;
          return;
        }

        viaturasInop.forEach(v => {
          const nome = obterValorCampo(v, ['viatura', 'veículo', 'veiculo', 'nome']) || 'N/A';
          const motivo = obterValorCampo(v, ['motivo', 'avaria', 'observações', 'observacoes', 'obs']) || 'Avaria Registada';

          const div = document.createElement('div');
          div.className = 'card card-inop';
          div.innerHTML = `
            <div class="inop-info">
              <h4>${nome}</h4>
              <p>${motivo}</p>
            </div>
            <span class="badge-inop">INOP</span>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro INOP:", err);
      }
    }

    // 3. AGENDAMENTOS (Mostra todos os registos ativos da tabela)
    async function carregarAgendamentos() {
      try {
        const res = await fetch(obterUrlGviz(GID_AGENDAMENTOS));
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-agendamentos');
        container.innerHTML = '';

        const agendamentosValidos = dados.filter(item => {
          const desc = obterValorCampo(item, ['descrição', 'descricao', 'evento', 'serviço', 'servico', 'agendamento', 'titulo']);
          const data = obterValorCampo(item, ['data', 'data/hora', 'dia']);
          return desc !== '' || data !== '';
        });

        if (agendamentosValidos.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem agendamentos registados.</div>`;
          return;
        }

        agendamentosValidos.forEach(item => {
          const dataRaw = obterValorCampo(item, ['data', 'data/hora', 'dia']);
          const horaRaw = obterValorCampo(item, ['hora', 'horario']);
          const descricao = obterValorCampo(item, ['descrição', 'descricao', 'evento', 'serviço', 'servico', 'agendamento', 'titulo']) || 'Serviço Agendado';
          const meios = obterValorCampo(item, ['meios', 'meios alocados', 'recursos', 'viatura']);

          let dataFormatada = dataRaw;
          if (horaRaw) dataFormatada += ` às ${horaRaw}`;

          const div = document.createElement('div');
          div.className = 'card card-agendamento';
          div.innerHTML = `
            ${dataFormatada ? `<div class="agendamento-data">📅 ${dataFormatada}</div>` : ''}
            <div class="agendamento-desc">${descricao}</div>
            ${meios ? `<div class="agendamento-meios">🚒 Meios: ${meios}</div>` : ''}
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro Agendamentos:", err);
      }
    }

    // 4. OBSERVAÇÕES
    async function carregarObservacoes() {
      try {
        const res = await fetch(obterUrlGviz(GID_OBSERVACOES));
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-observacoes');
        container.innerHTML = '';

        const listaObs = dados.filter(item => {
          const obs = obterValorCampo(item, ['observações', 'observacoes', 'observação', 'observacao', 'obs', 'informação', 'informacao']).trim();
          const estado = obterValorCampo(item, ['estado', 'status']).toUpperCase();
          return obs !== '' && obs !== '-' && !estado.includes('INATIVO');
        });

        if (listaObs.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem observações registadas.</div>`;
          return;
        }

        listaObs.forEach(item => {
          const titulo = obterValorCampo(item, ['título', 'titulo', 'assunto']);
          const obsTexto = obterValorCampo(item, ['observações', 'observacoes', 'observação', 'observacao', 'obs', 'informação', 'informacao']);

          const div = document.createElement('div');
          div.className = 'card card-observacao';
          div.innerHTML = `
            ${titulo ? `<div class="obs-titulo">📌 ${titulo}</div>` : ''}
            <div class="obs-texto">${obsTexto}</div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro Observações:", err);
      }
    }

    function carregarTodosOsDados() {
      carregarTeatroOperacoes();
      carregarViaturasINOP();
      carregarAgendamentos();
      carregarObservacoes();
      carregarMeteoIPMA();
    }

    setInterval(carregarTodosOsDados, 10000);
    carregarTodosOsDados();
  </script>
</body>
</html>
