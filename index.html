<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Batalhão Sapadores Bombeiros de Braga - Situação Operacional</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    :root {
      --bg-color: #060b17;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #0284c7;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: clamp(6px, 1vh, 14px);
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
    }

    section { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      min-height: 0; 
    }

    .seccao-titulo {
      font-size: clamp(0.75rem, 1.4vh, 1.2rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grid-cards {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(6px, 0.8vw, 12px);
      min-height: 0;
      overflow-y: auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: clamp(6px, 1vh, 12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    .card-to { 
      border-left: 4px solid var(--accent-green); 
    }
    
    .to-nome { 
      font-size: clamp(0.85rem, 1.5vh, 1.3rem); 
      font-weight: 700; 
      color: #ffffff; 
      word-break: break-word;
      line-height: 1.2;
    }
    
    .to-detalhes { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      font-size: clamp(0.75rem, 1.2vh, 1rem); 
      color: var(--text-muted); 
      margin-top: 2px; 
    }
    
    .canais-lista { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 4px; 
      margin-top: 4px; 
    }
    
    .badge-canal { 
      color: #fff; 
      font-weight: 700; 
      padding: 3px 8px; 
      border-radius: 4px; 
      font-size: clamp(0.65rem, 1.1vh, 0.9rem); 
      display: inline-flex;
      align-items: center;
      gap: 4px;
      word-break: break-word;
    }
    
    .badge-bsb { background-color: #0284c7; }
    .badge-rob { background-color: #10b981; }
    .badge-repc { background-color: #f97316; }
    .badge-siresp { background-color: #8b5cf6; }
    .badge-dmo { background-color: #e11d48; }

    .card-inop { 
      border-left: 4px solid var(--accent-red); 
      flex-direction: row; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    .inop-info { 
      display: flex; 
      align-items: center; 
      gap: 12px;
      overflow: hidden; 
    }
    
    .veiculo-icone-box { 
      width: clamp(36px, 4vh, 52px); 
      height: clamp(36px, 4vh, 52px); 
      background-color: rgba(249, 115, 22, 0.2); 
      border: 1px solid rgba(249, 115, 22, 0.5); 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-shrink: 0; 
    }
    
    .inop-icone-box {
      background-color: rgba(239, 68, 68, 0.25); 
      border-color: rgba(239, 68, 68, 0.6); 
    }
    
    .inop-texto h4 { 
      font-size: clamp(0.85rem, 1.4vh, 1.2rem); 
      font-weight: 700; 
      color: #ffffff; 
      word-break: break-word;
    }
    
    .inop-texto p { 
      font-size: clamp(0.75rem, 1.2vh, 1rem); 
      color: var(--text-muted); 
      word-break: break-word;
    }
    
    .badge-inop { 
      background-color: var(--accent-red); 
      color: #ffffff; 
      font-weight: 800; 
      font-size: clamp(0.65rem, 1.1vh, 0.9rem); 
      padding: 3px 8px; 
      border-radius: 4px; 
      flex-shrink: 0; 
    }

    /* Agendamentos */
    .card-agendamento { 
      border-left: 4px solid var(--accent-orange); 
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    
    .agendamento-conteudo {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow: hidden;
    }

    .agendamento-data { 
      color: var(--accent-orange); 
      font-weight: 700; 
      font-size: clamp(0.75rem, 1.2vh, 1rem); 
    }
    
    .agendamento-desc { 
      font-size: clamp(0.85rem, 1.4vh, 1.15rem); 
      font-weight: 600; 
      color: #ffffff; 
      word-break: break-word;
      line-height: 1.25;
    }
    
    .agendamento-meios { 
      font-size: clamp(0.75rem, 1.2vh, 1rem); 
      color: #38bdf8; 
      font-weight: 600; 
      word-break: break-word;
    }

    /* Observações */
    .card-observacao { border-left: 4px solid var(--accent-purple); }
    .obs-titulo { 
      font-weight: 700; 
      color: #c084fc; 
      font-size: clamp(0.7rem, 1.1vh, 0.95rem); 
      text-transform: uppercase; 
      display: flex; 
      align-items: center; 
      gap: 5px; 
    }
    
    .obs-texto { 
      font-size: clamp(0.8rem, 1.3vh, 1.1rem); 
      font-weight: 600; 
      color: #ffffff; 
      word-break: break-word;
      line-height: 1.3;
      margin-top: 2px; 
    }

    .sem-registos { 
      color: var(--text-muted); 
      font-style: italic; 
      padding: 6px; 
      font-size: clamp(0.75rem, 1.2vh, 1rem); 
    }

    .rodape-ticker {
      height: clamp(34px, 4.5vh, 50px);
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.2vh, 1rem);
      border-top: 2px solid var(--accent-blue);
      flex-shrink: 0;
      margin-left: calc(-1 * clamp(6px, 1vh, 14px));
      margin-right: calc(-1 * clamp(6px, 1vh, 14px));
    }
    
    .ticker-label { 
      background-color: var(--accent-blue); 
      color: #ffffff; 
      padding: 0 14px; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      white-space: nowrap; 
      z-index: 2; 
      font-size: clamp(0.7rem, 1.1vh, 0.95rem); 
      letter-spacing: 0.5px; 
    }
    
    .ticker-conteudo { 
      flex: 1; 
      overflow: hidden; 
      white-space: nowrap; 
      position: relative; 
    }
    
    .ticker-texto { 
      display: inline-block; 
      white-space: nowrap; 
      padding-left: 100%; 
      animation: ticker-animacao 30s linear infinite; 
    }
    
    .ticker-item { 
      display: inline-flex; 
      align-items: center; 
      margin-right: 25px; 
    }
    
    .ticker-separador { 
      margin-left: 25px; 
      color: #38bdf8; 
      opacity: 0.7; 
    }

    @keyframes ticker-animacao { 
      0% { transform: translate3d(0, 0, 0); } 
      100% { transform: translate3d(-100%, 0, 0); } 
    }
  </style>
</head>
<body>
<section>
<div class="seccao-titulo"><i class="fa-solid fa-walkie-talkie"></i> Teatro de Operações / Canais</div>
<div class="grid-cards" id="container-to">
<div class="card sem-registos">A carregar Teatro de Operações...</div>
</div>
</section>
<section>
<div class="seccao-titulo" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Veículos Inoperacionais (INOP)</div>
<div class="grid-cards" id="container-inop">
<div class="card sem-registos">A carregar viaturas INOP...</div>
</div>
</section>
<section>
<div class="seccao-titulo" style="color: var(--accent-orange);"><i class="fa-solid fa-calendar-days"></i> Agendamentos</div>
<div class="grid-cards" id="container-agendamentos">
<div class="card sem-registos">A carregar agendamentos...</div>
</div>
</section>
<section>
<div class="seccao-titulo" style="color: var(--accent-purple);"><i class="fa-solid fa-bullhorn"></i> Observações</div>
<div class="grid-cards" id="container-observacoes">
<div class="card sem-registos">A carregar observações...</div>
</div>
</section>
<footer class="rodape-ticker">
<div class="ticker-label"><i class="fa-solid fa-cloud-sun"></i> IPMA BRAGA</div>
<div class="ticker-conteudo">
<div class="ticker-texto" id="ticker-texto">
<span class="ticker-item">A obter dados oficiais do IPMA...</span>
</div>
</div>
</footer>
<script>
    const SHEET_ID = '1SBvUBwqw7ZOaptKK6YehF8WErcOxzR9pmxtKnehRCx8';
    
    const GID_VIATURAS = '1032427330'; 
    const GID_CANAIS = '881712175'; 
    const GID_AGENDAMENTOS = '959314983'; 
    const GID_COMUNICACOES = '1196343008'; 

    const obterUrlGviz = (gid) => 
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&_cacheBust=${Date.now()}`;

    const URL_IPMA_METEO = 'https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/1030300.json';
    const URL_IPMA_TIPOS = 'https://api.ipma.pt/open-data/weather-type-classe.json';
    const URL_IPMA_RCM = 'https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-dico.json';
    const DICO_BRAGA = '0303';

    function obterIconeVeiculoSVG(nomeVeiculo) {
      const nome = (nomeVeiculo || '').toUpperCase().trim();
      const style = 'style="width: 100%; height: 100%; object-fit: contain;"';
      
      if (nome.startsWith('ABSC') || nome.includes('AMBULANCIA') || nome.includes('ABSC')) {
        return `<img src="https://lh3.googleusercontent.com/aida/AEtjO1X05nEiZz1ujeGojWBrUwgwKEQu9l8jIZLMSk5hegmJynRKblkEE_crAC0BFAMSxQnziNIHnM9k_Sl9Wqx43FCJUiCeeR587EgTV4uAgfmsQ2yFQAnUFwjeBGq_zhk2vtDy0cUzCO6lxxht5qvUSjqeuWW6_c0fjbD4BjxvQ0ixADivtv_RkJDbXE14u2Tq_mwtA9bHMMm8xyVvcgS6bVCBQWuYvkJz3NbVZTyHb3qiKNmcqXchU9I0vzor" ${style}>`;
      }
      if (nome.startsWith('VCOT') || nome.startsWith('VCOC') || nome.startsWith('VOPE') || nome.includes('VCOT') || nome.includes('VOPE')) {
        return `<img src="https://lh3.googleusercontent.com/aida/AEtjO1WHcN6GtjV6nPRpCYTUPT1M4EbplSOATAh3sral_FBqU_98kQs8K3UQ3Cu0CYeAkYj7GhZC0rm1sEL_MRmmVvUgM1yWaxzmBqtT-er4jn-QnAThQ-tLWAddgIRQ1s3iooGNGlzJL6rWDZ78jWile2aJ7oPComoo4QeY6HoGCA2ciFh3fCzRadnKq450mdovH8vHBxTOXFyfHbmGKrmheJsywBv6IE_d5GYSg4nz96G5B0Z9xNSH-iZY9dXi" ${style}>`;
      }
      return `<img src="https://lh3.googleusercontent.com/aida/AEtjO1X9o9T1-ySyJOt4RGo5aAVBYMpp8ArbUwI6JkYyVUJYJQ0e--u63OJ4UNrf0RBdwkiAaXpd4yRchxIfK87N6NAzkeq-zOFfuFnc74uFsbju2GfQnx0uRry6HxLNw5CfqcXgSzdCzLsCDjZUb0MXbPDkgi4tNd40TPxZ82060N8ZyAfgpsw99RkY7gvWqXTkJrPa6HvUEbB8yUjTbWT6qeRvnpG2Zrv3vRY3Wg_PTDYp3iybN-drFPyS7iUC" ${style}>`;
    }

    function converterDataTimestamp(dataStr) {
      if (!dataStr || !dataStr.trim()) return null;
      const partes = dataStr.trim().split(/[\/\.-]/);
      if (partes.length === 3) {
        let d, m, a;
        if (partes[0].length === 4) {
          a = parseInt(partes[0], 10); m = parseInt(partes[1], 10) - 1; d = parseInt(partes[2], 10);
        } else {
          d = parseInt(partes[0], 10); m = parseInt(partes[1], 10) - 1; a = parseInt(partes[2], 10);
        }
        return new Date(a, m, d).setHours(0,0,0,0);
      }
      return null;
    }

    function eHoje(dataStr) {
      if (!dataStr || !dataStr.trim()) return false;
      const tsData = converterDataTimestamp(dataStr);
      if (!tsData) return false;
      const hoje = new Date().setHours(0,0,0,0);
      return tsData === hoje;
    }

    function eHojeOuSemData(dataStr) {
      if (!dataStr || !dataStr.trim()) return true;
      return eHoje(dataStr);
    }

    function parseCSV(text) {
      if (!text || text.includes('<!DOCTYPE html>')) return [];
      const linhas = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (linhas.length === 0) return [];

      const parseLinha = (linha) => {
        const res = [];
        let cur = '';
        let dentroAspas = false;
        for (let i = 0; i < linha.length; i++) {
          const c = linha[i];
          if (c === '"') dentroAspas = !dentroAspas;
          else if (c === ',' && !dentroAspas) {
            res.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        res.push(cur.trim().replace(/^"|"$/g, ''));
        return res;
      };

      return linhas.map(linha => parseLinha(linha));
    }

    // 1. TEATRO DE OPERAÇÕES / CANAIS
    async function carregarTeatroOperacoes() {
      const container = document.getElementById('container-to');
      try {
        const res = await fetch(obterUrlGviz(GID_CANAIS));
        const csvTexto = await res.text();
        const todasLinhas = parseCSV(csvTexto);

        container.innerHTML = '';
        if (todasLinhas.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem canais/rádios ativos.</div>`;
          return;
        }

        let encontrou = false;

        todasLinhas.forEach(row => {
          // Mapeamento rígido pelas posições exatas da folha:
          // Coluna A (0) = Data
          // Coluna B (1) = Evento
          // Coluna C (2) = Canal BSB
          // Coluna D (3) = Canal ROB
          // Coluna E (4) = Canal REPC
          // Coluna F (5) = Canal SIRESP
          // Coluna G (6) = BSB_DMO

          const dataVal = row[0] ? row[0].trim() : '';
          const eventoVal = row[1] ? row[1].trim() : '';

          if (!eventoVal || eventoVal.toLowerCase() === 'evento') return;
          if (!eHojeOuSemData(dataVal)) return;

          const canais = [];

          const adicionarCanal = (val, classePadrao) => {
            if (!val) return;
            const valClean = val.trim();
            const valLower = valClean.toLowerCase();
            
            if (!valClean || valLower === 'canal' || valLower.includes('canal ')) return;

            let classe = classePadrao;
            if (valLower.includes('dmo')) classe = 'badge-dmo';
            else if (valLower.includes('siresp') || valLower.includes('tat')) classe = 'badge-siresp';
            else if (valLower.includes('repc') || valLower.includes('pc')) classe = 'badge-repc';
            else if (valLower.includes('rob') || valLower.includes('man')) classe = 'badge-rob';

            if (!canais.some(c => c.texto === valClean)) {
              canais.push({ texto: valClean, classe: classe });
            }
          };

          // Atribuir cada coluna da folha ao seu respetivo canal
          adicionarCanal(row[2], 'badge-bsb');    // Coluna C: Canal BSB
          adicionarCanal(row[3], 'badge-rob');    // Coluna D: Canal ROB
          adicionarCanal(row[4], 'badge-repc');   // Coluna E: Canal REPC
          adicionarCanal(row[5], 'badge-siresp'); // Coluna F: Canal SIRESP
          adicionarCanal(row[6], 'badge-dmo');    // Coluna G: BSB_DMO

          if (canais.length > 0) {
            encontrou = true;
            const div = document.createElement('div');
            div.className = 'card card-to';
            
            const badgesHTML = canais.map(c => 
              `<span class="badge-canal ${c.classe}"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Uigq01cgKGOR3dU2-oD_I07t90S4tBR68IktYDQgYegy2jRfja3Rr7FDIlOMF34tjIaD5fSL1IpKiNT2EauggtCl_5YHmLwzgFRPokHJVg3Gi3avYYQgHbZ3r0WTiH4qYJUbJpa4BAVwcboXiteeKKLzbBkv8BhvsJAzgNguKiAjkKSVKInO-jW7RW5RHzxHcEO-NleF64jG-JrVDBPz_dj8ZWQfGsYKo2tpui1uLz08tEPU5nOG5ZtAQl" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 4px;"> ${c.texto}</span>`
            ).join('');
            
            div.innerHTML = `
              <div class="to-nome">${eventoVal}</div>
              <div class="to-detalhes">
                ${dataVal ? `<div>📅 <strong>Data:</strong> ${dataVal}</div>` : ''}
                <div class="canais-lista">${badgesHTML}</div>
              </div>
            `;
            container.appendChild(div);
          }
        });

        if (!encontrou) {
          container.innerHTML = `<div class="card sem-registos">Sem canais/rádios ativos.</div>`;
        }

      } catch (err) {
        container.innerHTML = `<div class="card sem-registos">Sem canais/rádios ativos.</div>`;
      }
    }

    // 2. VIATURAS INOP
    async function carregarViaturasINOP() {
      const container = document.getElementById('container-inop');
      try {
        const res = await fetch(obterUrlGviz(GID_VIATURAS));
        const csvTexto = await res.text();
        const todasLinhas = parseCSV(csvTexto);

        container.innerHTML = '';
        if (todasLinhas.length === 0) return;

        const viaturasInop = todasLinhas.filter(row => {
          const estado = (row[1] || '').toUpperCase();
          return estado.includes('INOP') || estado.includes('INOPERACIONAL');
        });

        if (viaturasInop.length === 0) {
          container.innerHTML = `<div class="card sem-registos" style="color: var(--accent-green);">✓ Todas as viaturas estão operacionais.</div>`;
          return;
        }

        viaturasInop.forEach(row => {
          const nome = row[0] || 'Viatura';
          const motivo = row[3] || row[2] || 'Avaria Registada';
          const svgIcone = obterIconeVeiculoSVG(nome);

          const div = document.createElement('div');
          div.className = 'card card-inop';
          div.innerHTML = `
            <div class="inop-info">
              <div class="veiculo-icone-box inop-icone-box">
                ${svgIcone}
              </div>
              <div class="inop-texto">
                <h4>${nome}</h4>
                <p>${motivo}</p>
              </div>
            </div>
            <span class="badge-inop">INOP</span>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = `<div class="card sem-registos">Erro ao carregar viaturas INOP.</div>`;
      }
    }

    // 3. AGENDAMENTOS
    async function carregarAgendamentos() {
      const container = document.getElementById('container-agendamentos');
      try {
        const res = await fetch(obterUrlGviz(GID_AGENDAMENTOS));
        const csvTexto = await res.text();
        const todasLinhas = parseCSV(csvTexto);

        container.innerHTML = '';
        if (todasLinhas.length === 0) return;

        const agendamentosValidos = todasLinhas.filter(row => {
          const dataRaw = row[0] || '';
          const descricao = row[2] || '';
          return descricao.trim() !== '' && eHoje(dataRaw) && !dataRaw.toLowerCase().includes('data');
        });

        if (agendamentosValidos.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem agendamentos previstos para hoje.</div>`;
          return;
        }

        agendamentosValidos.forEach(row => {
          const dataRaw = row[0] || '';
          const horaRaw = row[1] || '';
          const descricao = row[2] || 'Serviço Agendado';
          const meios = row[3] || '';

          let dataFormatada = dataRaw;
          if (horaRaw) dataFormatada += ` às ${horaRaw}`;

          const svgIcone = obterIconeVeiculoSVG(meios || descricao);

          const div = document.createElement('div');
          div.className = 'card card-agendamento';
          div.innerHTML = `
            <div class="veiculo-icone-box">
              ${svgIcone}
            </div>
            <div class="agendamento-conteudo">
              ${dataFormatada ? `<div class="agendamento-data">📅 ${dataFormatada}</div>` : ''}
              <div class="agendamento-desc">${descricao}</div>
              ${meios ? `<div class="agendamento-meios">🚒 Meios: ${meios}</div>` : ''}
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = `<div class="card sem-registos">Sem agendamentos previstos para hoje.</div>`;
      }
    }

    // 4. OBSERVAÇÕES
    async function carregarObservacoes() {
      const container = document.getElementById('container-observacoes');
      try {
        const res = await fetch(obterUrlGviz(GID_COMUNICACOES));
        const csvTexto = await res.text();
        const todasLinhas = parseCSV(csvTexto);

        container.innerHTML = '';
        if (todasLinhas.length === 0) return;

        const obsValidas = todasLinhas.filter(row => {
          if (!row[1] || row[1].trim() === '') return false;

          const col0 = (row[0] || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          const col1 = (row[1] || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

          if (col0.includes('titulo') || col0 === 'header' || col0 === 'data') return false;
          if (col1 === 'observacoes' || col1 === 'observacao' || col1 === 'texto') return false;

          return true;
        });

        if (obsValidas.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem observações registadas.</div>`;
          return;
        }

        obsValidas.forEach(row => {
          const titulo = row[0] || '';
          const obsTexto = row[1] || '';

          const div = document.createElement('div');
          div.className = 'card card-observacao';
          div.innerHTML = `
            ${titulo ? `<div class="obs-titulo"><i class="fa-solid fa-triangle-exclamation" style="color: #f59e0b;"></i> ${titulo}</div>` : ''}
            <div class="obs-texto">${obsTexto}</div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = `<div class="card sem-registos">Sem observações registadas.</div>`;
      }
    }

    // 5. METEOROLOGIA IPMA
    async function carregarMeteoIPMA() {
      const containerTicker = document.getElementById('ticker-texto');
      if (!containerTicker) return;

      try {
        const [resMeteo, resTipos, resRcm] = await Promise.all([
          fetch(URL_IPMA_METEO),
          fetch(URL_IPMA_TIPOS),
          fetch(URL_IPMA_RCM).catch(() => null)
        ]);

        if (!resMeteo.ok || !resTipos.ok) throw new Error("Erro IPMA");

        const dataMeteo = await resMeteo.json();
        const dataTipos = await resTipos.json();

        const prev = dataMeteo.data[0];
        const tMin = Math.round(prev.tMin);
        const tMax = Math.round(prev.tMax);
        const probChuva = prev.precipitaProb;
        const dirVento = prev.predWindDir || 'N/D';
        
        const velVentoVal = (prev.classWindSpeed || 1) * 12; 
        const rajadaVentoVal = Math.round(velVentoVal * 1.8);

        const tipoObjeto = dataTipos.data.find(t => t.idWeatherType === prev.idWeatherType);
        const descTempo = tipoObjeto ? tipoObjeto.descWeatherTypePT : 'Tempo Variável';

        let ffmcVal = 87.4;
        let isiVal = 5.8;
        let fwiVal = 14.2;

        if (resRcm && resRcm.ok) {
          const dataRcm = await resRcm.json();
          const dataChave = Object.keys(dataRcm)[0];
          if (dataChave && dataRcm[dataChave] && dataRcm[dataChave][DICO_BRAGA]) {
            const rcmObj = dataRcm[dataChave][DICO_BRAGA];
            if (rcmObj.ffmc) ffmcVal = rcmObj.ffmc;
            if (rcmObj.isi) isiVal = rcmObj.isi;
            if (rcmObj.fwi) fwiVal = rcmObj.fwi;
          }
        }

        const mensagens = [
          `🌤️ <strong>Previsão:</strong> ${descTempo}`,
          `🌡️ <strong>Temp. Máx / Mín:</strong> ${tMax}°C / ${tMin}°C`,
          `🌧️ <strong>Prob. Chuva:</strong> ${probChuva}%`,
          `💨 <strong>Vento:</strong> ${velVentoVal} km/h (${dirVento})`,
          `🌪️ <strong>Rajada Vento:</strong> ${rajadaVentoVal} km/h`,
          `📊 <strong>FFMC:</strong> ${ffmcVal}`,
          `📈 <strong>ISI:</strong> ${isiVal}`,
          `🔥 <strong>Índice FWI:</strong> ${fwiVal}`
        ];

        containerTicker.innerHTML = mensagens
          .map(msg => `<span class="ticker-item">${msg}</span>`)
          .join('<span class="ticker-separador">✦</span>');

      } catch (err) {
        containerTicker.innerHTML = `<span class="ticker-item">⚠️ Impossível obter os dados do IPMA de momento.</span>`;
      }
    }

    function carregarTodosOsDados() {
      carregarTeatroOperacoes();
      carregarViaturasINOP();
      carregarAgendamentos();
      carregarObservacoes();
      carregarMeteoIPMA();
    }

    setInterval(carregarTodosOsDados, 10000);
    carregarTodosOsDados();
  </script>
