<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalhão Sapadores Bombeiros de Braga - Centro de Comando</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0e131f;
      --card-bg: #161b28;
      --card-border: #343947;
      --accent-green: #10b981;
      --accent-blue: #0ea5e9;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: clamp(8px, 1.2vh, 16px);
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-container { width: 40px; height: 40px; background: rgba(14, 165, 233, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .logo-container i { color: var(--accent-blue); font-size: 24px; }
    .brand-text h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
    .brand-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .live-indicator { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); padding: 4px 10px; border-radius: 20px; color: var(--accent-green); font-size: 0.7rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .pulse { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 2s infinite; }

    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

    /* Layout Principal */
    main { flex: 1; display: grid; grid-template-columns: 2fr 1fr; gap: clamp(10px, 1.5vw, 16px); min-height: 0; }
    .main-column { display: flex; flex-direction: column; gap: clamp(10px, 1.5vw, 16px); min-height: 0; }
    .side-column { display: flex; flex-direction: column; gap: clamp(10px, 1.5vw, 16px); min-height: 0; }

    section { flex: 1; display: flex; flex-direction: column; min-height: 0; background: rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 12px; border: 1px solid var(--card-border); }
    .seccao-titulo { font-size: 0.85rem; font-weight: 800; letter-spacing: 1px; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 12px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

    .grid-cards { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; overflow-y: auto; padding-right: 4px; }
    .grid-cards::-webkit-scrollbar { width: 4px; }
    .grid-cards::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 10px; }

    /* Cartões */
    .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; position: relative; transition: transform 0.2s; }
    .card:hover { border-color: rgba(14, 165, 233, 0.3); }

    /* TO / Canais */
    .card-to { border-left: 4px solid var(--accent-blue); }
    .to-nome { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .canais-lista { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge-canal { 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      color: #fff;
    }
    .badge-canal img { width: 14px; height: 14px; filter: brightness(0) invert(1); }
    
    .badge-bsb { background-color: #0284c7; }
    .badge-rob { background-color: #10b981; }
    .badge-repc { background-color: #f97316; }
    .badge-siresp { background-color: #8b5cf6; }
    .badge-dmo { background-color: #e11d48; }

    /* INOP */
    .card-inop { border-left: 4px solid var(--accent-red); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .inop-info { display: flex; align-items: center; gap: 14px; }
    .inop-img { width: 56px; height: 56px; object-fit: contain; background: rgba(239, 68, 68, 0.1); border-radius: 8px; padding: 4px; border: 1px solid rgba(239, 68, 68, 0.2); }
    .inop-texto h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
    .inop-texto p { font-size: 0.8rem; color: var(--text-muted); }
    .badge-inop { background: var(--accent-red); color: #fff; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px; }

    /* Agendamentos & Observações */
    .card-agendamento { border-left: 4px solid var(--accent-orange); }
    .agendamento-data { color: var(--accent-orange); font-size: 0.75rem; font-weight: 800; margin-bottom: 4px; }
    .agendamento-desc { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
    .agendamento-meios { font-size: 0.8rem; color: var(--accent-blue); font-weight: 600; }

    .card-observacao { border-left: 4px solid var(--accent-purple); }
    .obs-titulo { color: #c084fc; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .obs-texto { font-size: 0.85rem; font-weight: 500; line-height: 1.4; }

    .sem-registos { color: var(--text-muted); font-style: italic; font-size: 0.8rem; padding: 10px; }

    /* Ticker */
    .rodape-ticker {
      height: 40px;
      background-color: #090e1a;
      display: flex;
      align-items: center;
      border-top: 2px solid var(--accent-blue);
      flex-shrink: 0;
      margin: 0 -16px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .ticker-label { background-color: var(--accent-blue); color: #fff; padding: 0 15px; height: 100%; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .ticker-conteudo { flex: 1; overflow: hidden; white-space: nowrap; }
    .ticker-texto { display: inline-block; padding-left: 100%; animation: ticker-animacao 35s linear infinite; }
    .ticker-item { display: inline-flex; align-items: center; margin-right: 40px; }
    .ticker-separador { color: var(--accent-blue); opacity: 0.5; margin-right: 40px; }

    @keyframes ticker-animacao { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-container"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="brand-text">
        <h1>Sapadores Braga Ops</h1>
        <p id="data-atual">Carregando dados...</p>
      </div>
    </div>
    <div class="live-indicator">
      <div class="pulse"></div> LIVE FEED
    </div>
  </header>

  <main>
    <div class="main-column">
      <section>
        <div class="seccao-titulo"><i class="fa-solid fa-walkie-talkie"></i> Teatro de Operações / Canais</div>
        <div class="grid-cards" id="container-to">
          <div class="card sem-registos">A carregar...</div>
        </div>
      </section>
      
      <section style="flex: 0 0 auto; min-height: 200px;">
        <div class="seccao-titulo" style="color: var(--accent-purple);"><i class="fa-solid fa-bullhorn"></i> Observações</div>
        <div class="grid-cards" id="container-observacoes">
          <div class="card sem-registos">A carregar...</div>
        </div>
      </section>
    </div>

    <div class="side-column">
      <section style="flex: 2;">
        <div class="seccao-titulo" style="color: var(--accent-red);"><i class="fa-solid fa-triangle-exclamation"></i> Veículos INOP</div>
        <div class="grid-cards" style="grid-template-columns: 1fr;" id="container-inop">
          <div class="card sem-registos">A carregar...</div>
        </div>
      </section>

      <section style="flex: 1;">
        <div class="seccao-titulo" style="color: var(--accent-orange);"><i class="fa-solid fa-calendar-days"></i> Agendamentos</div>
        <div class="grid-cards" style="grid-template-columns: 1fr;" id="container-agendamentos">
          <div class="card sem-registos">A carregar...</div>
        </div>
      </section>
    </div>
  </main>

  <footer class="rodape-ticker">
    <div class="ticker-label"><i class="fa-solid fa-cloud-sun"></i> IPMA BRAGA</div>
    <div class="ticker-conteudo">
      <div class="ticker-texto" id="ticker-texto">
        <span class="ticker-item">A sincronizar com servidores IPMA...</span>
      </div>
    </div>
  </footer>

  <script>
    // Configurações Google Sheets
    const SHEET_ID = '1SBvUBwqw7ZOaptKK6YehF8WErcOxzR9pmxtKnehRCx8';
    const GID_VIATURAS = '1032427330'; 
    const GID_CANAIS = '881712175'; 
    const GID_AGENDAMENTOS = '959314983'; 
    const GID_COMUNICACOES = '1196343008'; 

    // Assets Visuais (DataStore Placeholders)
    const ASSETS = {
      RADIO: '{{DATA:IMAGE:IMAGE:IMAGE_6}}',
      FIRE_TRUCK: '{{DATA:IMAGE:IMAGE:IMAGE_3}}',
      COMMAND_SUV: '{{DATA:IMAGE:IMAGE:IMAGE_4}}',
      AMBULANCE: '{{DATA:IMAGE:IMAGE:IMAGE_5}}'
    };

    const obterUrlGviz = (gid) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&_cacheBust=${Date.now()}`;

    // Atualiza Relógio
    function atualizarRelogio() {
      const agora = new Date();
      const dias = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
      const dataStr = `${dias[agora.getDay()]}, ${agora.toLocaleDateString('pt-PT')} | ${agora.toLocaleTimeString('pt-PT')}`;
      document.getElementById('data-atual').innerText = dataStr.toUpperCase();
    }
    setInterval(atualizarRelogio, 1000);

    function obterImagemVeiculo(nome) {
      const n = (nome || '').toUpperCase();
      if (n.includes('ABSC') || n.includes('AMBUL')) return ASSETS.AMBULANCE;
      if (n.includes('VCOT') || n.includes('VCOC') || n.includes('VOPE')) return ASSETS.COMMAND_SUV;
      if (n.includes('VFCI') || n.includes('VUCI') || n.includes('VECI')) return ASSETS.FIRE_TRUCK;
      return ASSETS.FIRE_TRUCK; // Default
    }

    function parseCSV(text) {
      if (!text || text.includes('<!DOCTYPE html>')) return [];
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
      return lines.map(line => {
        const res = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') inQuotes = !inQuotes;
          else if (line[i] === ',' && !inQuotes) { res.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
          else cur += line[i];
        }
        res.push(cur.trim().replace(/^"|"$/g, ''));
        return res;
      });
    }

    async function carregarTO() {
      const container = document.getElementById('container-to');
      try {
        const res = await fetch(obterUrlGviz(GID_CANAIS));
        const rows = parseCSV(await res.text());
        container.innerHTML = '';
        
        const hoje = new Date().toLocaleDateString('pt-PT');
        const eventosHoje = rows.filter(r => r[0] === hoje || r[1] === hoje);

        if (eventosHoje.length === 0) {
          container.innerHTML = '<div class="sem-registos">Nenhum teatro de operações ativo hoje.</div>';
          return;
        }

        eventosHoje.forEach(r => {
          const evento = r[1] || r[0];
          const div = document.createElement('div');
          div.className = 'card card-to';
          
          let badgesHTML = '';
          r.slice(2).forEach(val => {
            if (!val || val.includes('/')) return;
            let cls = 'badge-bsb';
            if (val.includes('DMO')) cls = 'badge-dmo';
            else if (val.includes('REPC')) cls = 'badge-repc';
            else if (val.includes('ROB')) cls = 'badge-rob';
            else if (val.includes('SIRESP')) cls = 'badge-siresp';
            
            badgesHTML += `<span class="badge-canal ${cls}"><img src="${ASSETS.RADIO}"> ${val}</span>`;
          });

          div.innerHTML = `<div class="to-nome">${evento}</div><div class="canais-lista">${badgesHTML}</div>`;
          container.appendChild(div);
        });
      } catch (e) { container.innerHTML = '<div class="sem-registos">Erro na ligação de dados.</div>'; }
    }

    async function carregarINOP() {
      const container = document.getElementById('container-inop');
      try {
        const res = await fetch(obterUrlGviz(GID_VIATURAS));
        const rows = parseCSV(await res.text());
        container.innerHTML = '';
        
        const inops = rows.filter(r => (r[1] || '').toUpperCase().includes('INOP'));
        if (inops.length === 0) {
          container.innerHTML = '<div class="sem-registos" style="color: var(--accent-green);">✓ Todas as viaturas operacionais.</div>';
          return;
        }

        inops.forEach(r => {
          const div = document.createElement('div');
          div.className = 'card card-inop';
          div.innerHTML = `
            <div class="inop-info">
              <img src="${obterImagemVeiculo(r[0])}" class="inop-img">
              <div class="inop-texto"><h4>${r[0]}</h4><p>${r[3] || 'Avaria Registada'}</p></div>
            </div>
            <span class="badge-inop">INOP</span>
          `;
          container.appendChild(div);
        });
      } catch (e) { container.innerHTML = '<div class="sem-registos">Erro nos dados de frotas.</div>'; }
    }

    async function carregarAgendamentos() {
      const container = document.getElementById('container-agendamentos');
      try {
        const res = await fetch(obterUrlGviz(GID_AGENDAMENTOS));
        const rows = parseCSV(await res.text()).slice(1);
        container.innerHTML = '';
        
        const validos = rows.filter(r => r[2] && r[2].trim() !== '');
        if (validos.length === 0) {
          container.innerHTML = '<div class="sem-registos">Sem serviços agendados.</div>';
          return;
        }

        validos.forEach(r => {
          const div = document.createElement('div');
          div.className = 'card card-agendamento';
          div.innerHTML = `
            <div class="agendamento-data">📅 ${r[0]} | ${r[1]}</div>
            <div class="agendamento-desc">${r[2]}</div>
            <div class="agendamento-meios">🚒 Meios: ${r[3] || 'Por definir'}</div>
          `;
          container.appendChild(div);
        });
      } catch (e) { container.innerHTML = '<div class="sem-registos">Erro nos agendamentos.</div>'; }
    }

    async function carregarObservacoes() {
      const container = document.getElementById('container-observacoes');
      try {
        const res = await fetch(obterUrlGviz(GID_COMUNICACOES));
        const rows = parseCSV(await res.text()).slice(1);
        container.innerHTML = '';
        
        const validas = rows.filter(r => r[1] && r[1].trim() !== '');
        if (validas.length === 0) {
          container.innerHTML = '<div class="sem-registos">Sem observações táticas.</div>';
          return;
        }

        validas.forEach(r => {
          const div = document.createElement('div');
          div.className = 'card card-observacao';
          div.innerHTML = `
            <div class="obs-titulo"><i class="fa-solid fa-circle-info"></i> ${r[0] || 'INFORMAÇÃO'}</div>
            <div class="obs-texto">${r[1]}</div>
          `;
          container.appendChild(div);
        });
      } catch (e) { container.innerHTML = '<div class="sem-registos">Erro nas observações.</div>'; }
    }

    async function carregarIPMA() {
      const ticker = document.getElementById('ticker-texto');
      try {
        const res = await fetch('https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/1030300.json');
        const data = await res.json();
        const p = data.data[0];
        
        const msg = [
          `🌡️ <strong>Máx:</strong> ${p.tMax}°C`,
          `🌡️ <strong>Mín:</strong> ${p.tMin}°C`,
          `🌧️ <strong>Chuva:</strong> ${p.precipitaProb}%`,
          `💨 <strong>Vento:</strong> ${p.predWindDir}`
        ];

        ticker.innerHTML = msg.map(m => `<span class="ticker-item">${m}</span>`).join('<span class="ticker-separador">✦</span>');
      } catch (e) { ticker.innerHTML = '⚠️ Erro ao obter dados IPMA.'; }
    }

    function init() {
      carregarTO(); carregarINOP(); carregarAgendamentos(); carregarObservacoes(); carregarIPMA();
    }

    setInterval(init, 30000); // Sincroniza a cada 30s
    init();
  </script>
</body>
</html>
