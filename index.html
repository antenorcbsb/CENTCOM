<!BSB html>
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Operacional</title>
</head>
<body>

  <!-- Container onde os cards serão renderizados -->
  <div id="container-agendamentos"></div>

  <script>
    // Ícone alternado entre Agendamento e Informação
    function obterIconoAgendamento(tipo = '', cor = '#fb923c') {
      const tipoLimpo = tipo.toLowerCase().trim();

      // Se for Informação
      if (tipoLimpo.includes('info') || tipoLimpo.includes('informacao') || tipoLimpo.includes('informação')) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>`;
      }

      // Ícone Padrão: Agendamento / Calendário
      return `<svg viewBox="0 0 24 24" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <rect x="7" y="14" width="3" height="3" fill="${cor}"/>
      </svg>`;
    }

    // 3. AGENDAMENTOS E INFORMAÇÕES DO DIA
    async function carregarAgendamentos() {
      try {
        const dados = await obterDadosAba(GIDS.agendamentos);
        const linhas = dados.slice(1);
        const container = document.getElementById('container-agendamentos');

        // Assumindo que a Coluna A (col[0]) é a Data
        const agendamentosHoje = linhas.filter(col => ehDataDeHoje(col[0]));

        if (agendamentosHoje.length === 0) {
          container.innerHTML = '<p style="color:#94a3b8; padding: 10px;">Sem agendamentos ou informações para hoje.</p>';
          return;
        }

        container.innerHTML = agendamentosHoje.map((col, index) => {
          // Mapeamento atualizado considerando a nova coluna na Coluna B (col[1])
          const tipo = col[1] ? col[1].trim() : 'Agendamento';
          const hora = col[2] ? col[2].trim() : '';
          const descricao = col[3] || '';
          const meiosTexto = col[4] || '';
          const equipas = col[5] || '';

          const ehInformacao = tipo.toLowerCase().includes('info');

          // Define a cor de destaque principal (Laranja para Agendamentos, Violeta para Informação)
          const corAtual = ehInformacao ? '#a855f7' : '#fb923c';
          const svgAgendamento = obterIconoAgendamento(tipo, corAtual);

          let meiosHtml = '';
          if (meiosTexto.trim()) {
            const listaMeios = meiosTexto.split(/[,;/+]/).map(m => m.trim()).filter(m => m.length > 0);
            const itensMeios = listaMeios.map(meio => {
              const svgIcone = obterIconoMeioEspecifico(meio);
              return `<span class="meio-item">${svgIcone} <span>${meio}</span></span>`;
            }).join('');

            meiosHtml = `
              <div class="meios-container">
                <strong style="color: #94a3b8; margin-right: 2px;">Meios:</strong>
                ${itensMeios}
              </div>
            `;
          }

          const bombeirosBadges = equipas ? equipas.split(/[,;/]/).map(num => {
            const numLimpo = num.trim();
            return numLimpo ? `<span class="bombeiro-tag">${SVG_CAPACETE_BOMBEIRO} ${numLimpo}</span>` : '';
          }).join('') : '';

          return `
            <div class="item-card" style="border-left-color: ${corAtual};">
              <div class="item-info">
                <div class="item-icon-svg">${svgAgendamento}</div>
                <div class="item-details" style="width: 100%;">
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                    <p style="color: ${corAtual}; font-weight: bold; font-size: 0.95rem;">${descricao}</p>
                    <span style="font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background-color: #0f172a; border: 1px solid ${corAtual}; color: ${corAtual}; text-transform: uppercase; font-weight: bold; white-space: nowrap;">
                      ${tipo}
                    </span>
                  </div>
                  
                  ${hora ? `
                    <div class="hora-container" style="color: ${ehInformacao ? '#c084fc' : '#fb923c'};">
                      ${MINI_ICONE_RELOGIO}
                      <span>${hora}</span>
                    </div>
                  ` : ''}

                  ${meiosHtml}

                  ${bombeirosBadges ? `
                    <div class="bombeiros-container">
                      <span class="bombeiros-label">Equipas:</span>
                      ${bombeirosBadges}
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error("Erro nos Agendamentos:", e);
      }
    }
  </script>
</body>
</html>
